<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloom & Wander | My E-Portfolio</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap');

:root {
  --cream: #faf8ef;
  --green: #526b4c;
  --dark: #30442f;
  --pink: #e8a4b5;
  --purple: #a99acb;
  --yellow: #e9cb7b;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  color: var(--dark);
  background: var(--cream);
  font-family: 'DM Sans', sans-serif;
}

button { font: inherit; cursor: pointer; }

h1, h2, h3 {
  font-family: 'Playfair Display', serif;
  font-weight: 500;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 7%;
  gap: 12px;
}

.brand { font-size: 15px; letter-spacing: 2px; }
.brand span { color: #b77b91; }

nav a {
  color: var(--green);
  text-decoration: none;
  margin-left: 18px;
  font-size: 13px;
}

.hero {
  min-height: 78vh;
  display: grid;
  place-items: center;
  text-align: center;
  padding: 50px 20px;
  background:
    radial-gradient(ellipse at 15% 75%, #e6ebd9 0, transparent 35%),
    radial-gradient(ellipse at 85% 25%, #f2e3e7 0, transparent 34%);
}

.eyebrow {
  text-transform: uppercase;
  letter-spacing: 4px;
  font-size: 11px;
  color: #7c9272;
}

.hero h1 {
  font-size: clamp(48px, 9vw, 94px);
  line-height: 1.04;
  margin: 20px 0;
}

.hero h1 em { color: #b87c94; }

.hero p {
  max-width: 440px;
  line-height: 1.9;
  color: #71806a;
  margin: 0 auto 28px;
}

.primary {
  border: 0;
  background: var(--green);
  color: white;
  border-radius: 40px;
  padding: 14px 25px;
  transition: transform .25s, background .25s;
}

.primary:hover {
  transform: translateY(-3px);
  background: var(--dark);
}

.section {
  padding: 65px 7%;
  text-align: center;
}

.section h2 {
  font-size: clamp(30px, 5vw, 48px);
  margin: 12px 0;
}

.subtitle {
  color: #7d8976;
  line-height: 1.8;
  font-size: 14px;
}

.map {
  position: relative;
  max-width: 1050px;
  height: 700px;
  margin: 35px auto 0;
  overflow: hidden;
  border-radius: 35px;
  border: 1px solid #e2e5d5;
  background:
    radial-gradient(ellipse at 12% 20%, #e3ead4 0 10%, transparent 27%),
    radial-gradient(ellipse at 88% 25%, #e9eddc 0 13%, transparent 30%),
    radial-gradient(ellipse at 20% 85%, #e5ebd8 0 14%, transparent 30%),
    radial-gradient(ellipse at 85% 82%, #e9e9d5 0 12%, transparent 28%),
    #f5f3e7;
}

/* Winding garden path */
.path {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.path-under {
  fill: none;
  stroke: #e0dcc7;
  stroke-width: 48;
  stroke-linecap: round;
}

.path-line {
  fill: none;
  stroke: #fffdf3;
  stroke-width: 40;
  stroke-linecap: round;
  stroke-dasharray: 3 12;
}

/* Decorative garden flowers */
.decor {
  position: absolute;
  font-size: 24px;
  opacity: .8;
  pointer-events: none;
  animation: sway 4s ease-in-out infinite;
}

@keyframes sway {
  0%, 100% { transform: rotate(-5deg); }
  50% { transform: rotate(7deg); }
}

/* Clickable subject destinations */
.stop {
  position: absolute;
  transform: translate(-50%, -50%);
  z-index: 3;
  border: 0;
  background: transparent;
  color: var(--dark);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  min-width: 100px;
  padding: 8px;
}

.flower {
  width: 65px;
  height: 65px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  font-size: 34px;
  background: #fffdf4;
  box-shadow: 0 5px 18px #526b4c18;
  transition: transform .45s cubic-bezier(.2,.8,.2,1),
              box-shadow .4s;
}

.stop:hover .flower,
.stop.active .flower {
  transform: scale(1.25) rotate(12deg);
  box-shadow: 0 0 0 9px #ffffff70, 0 8px 25px #526b4c25;
}

.stop.active .flower {
  animation: bloom .65s ease;
}

@keyframes bloom {
  0% { transform: scale(.7); }
  65% { transform: scale(1.4); }
  100% { transform: scale(1.25); }
}

.stop-label {
  font-size: 12px;
  font-weight: 600;
  background: #fffdf0d9;
  border-radius: 20px;
  padding: 7px 11px;
  box-shadow: 0 2px 8px #526b4c0c;
  white-space: nowrap;
}

/* Subject locations */
#s0 { left: 15%; top: 25%; }
#s1 { left: 39%; top: 18%; }
#s2 { left: 67%; top: 30%; }
#s3 { left: 79%; top: 62%; }
#s4 { left: 43%; top: 76%; }
#s5 { left: 17%; top: 65%; }

/* Butterfly travels between destinations */
.butterfly {
  position: absolute;
  z-index: 5;
  left: 15%;
  top: 25%;
  font-size: 35px;
  line-height: 1;
  pointer-events: none;
  transform: translate(-50%, -90%);
  transition: left 1.3s cubic-bezier(.2,.7,.2,1),
              top 1.3s cubic-bezier(.2,.7,.2,1);
  animation: flutter 1.1s ease-in-out infinite;
  filter: drop-shadow(0 4px 3px #7c705333);
}

@keyframes flutter {
  0%, 100% { margin-top: 0; }
  50% { margin-top: -12px; }
}
